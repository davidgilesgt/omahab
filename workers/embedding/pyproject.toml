[project]
name = "omahab-embedding-worker"
version = "0.1.0"
description = "Isolated local embedding worker for Omahab — bounded protocol over loopback/Unix socket"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]
bench = [
    "psutil>=5.9",
]
dev = [
    "pytest>=8",
    "psutil>=5.9",
]

[project.scripts]
omahab-embedding-worker = "workers.embedding.server:main"
omahab-embedding-benchmark = "workers.embedding.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

# onnxruntime ships no type stubs. This override is scoped to that
# third-party boundary only: application code stays under --strict, and no
# invented SDK shapes are used (runtime behavior comes from the installed
# package; annotations reference it via TYPE_CHECKING).
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
