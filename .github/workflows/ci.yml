name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix build --no-link .#checks.x86_64-linux.go-vet --print-build-logs
      - run: nix eval .#nixosConfigurations.omahab-installed.config.system.build.toplevel.drvPath
      - run: nix build --no-link .#checks.x86_64-linux.installed-closure --print-build-logs
      - run: nix build --no-link .#checks.x86_64-linux.go-test --print-build-logs
      - run: nix build --no-link .#packages.x86_64-linux.omahab-web --print-build-logs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            workers/email/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ../dist/playwright/browsers
      - name: Simulated browser presentation checks
        run: npm run test:ui
        working-directory: web
      - run: npm ci
        working-directory: workers/email
      - run: npm run typecheck
        working-directory: workers/email
      - run: npm test
        working-directory: workers/email
      - run: npm run knip
        working-directory: workers/email
      - run: npm run knip -- --production
        working-directory: workers/email
      - run: nix develop --command bash scripts/check.sh
  setup-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      - run: nix build --no-link .#checks.x86_64-linux.setup-regressions --print-build-logs
  integration:
    runs-on: ubuntu-latest
    # NixOS VM test needs KVM. GitHub ubuntu-latest has /dev/kvm since 2024.
    # If KVM is unavailable, this job may fail; keep checks as the blocking gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      - run: nix build --no-link .#checks.x86_64-linux.integration --print-build-logs
      - run: nix build --no-link .#checks.x86_64-linux.installer-disk --print-build-logs
