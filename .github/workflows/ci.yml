name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix build .#checks.x86_64-linux.go-vet --print-build-logs
      - run: nix eval .#nixosConfigurations.omahab-installed.config.system.build.toplevel.drvPath
      - run: nix build .#checks.x86_64-linux.go-test --print-build-logs
      - run: nix build .#packages.x86_64-linux.omahab-web --print-build-logs
      - run: bash scripts/check.sh
  integration:
    runs-on: ubuntu-latest
    # NixOS VM test needs KVM. GitHub ubuntu-latest has /dev/kvm since 2024.
    # If KVM is unavailable, this job may fail; keep checks as the blocking gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      - run: nix build .#checks.x86_64-linux.integration --print-build-logs
      - run: nix build .#checks.x86_64-linux.installer-disk --print-build-logs
