  /api/v1/knowledge/sources:
    get:
      summary: List knowledge sources with deep links
      operationId: knowledgeListSources
      responses:
        '200': { description: Sources, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/KnowledgeSource' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/knowledge/index-setup-options:
    get:
      summary: Index setup options (Best English / Best worldwide / Full-text only)
      operationId: knowledgeIndexSetupOptions
      responses:
        '200': { description: Options, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/IndexSetupOption' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/knowledge/pinned-models:
    get:
      summary: Pinned model metadata (license, size, memory)
      operationId: knowledgePinnedModels
      responses:
        '200': { description: Models, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ModelInfo' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/knowledge/consent:
    get:
      summary: Get summarization consent (per provider)
      operationId: knowledgeGetConsent
      parameters:
        - name: principal
          in: query
          required: true
          schema: { type: string }
        - name: provider
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Consent, content: { application/json: { schema: { type: object, required: [principal, provider, granted], properties: { principal: { type: string }, provider: { type: string }, granted: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Set summarization consent (per provider)
      operationId: knowledgeSetConsent
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [principal, provider, granted], properties: { principal: { type: string }, provider: { type: string }, granted: { type: boolean } } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, required: [principal, provider, granted], properties: { principal: { type: string }, provider: { type: string }, granted: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/setup:
    get:
      summary: Get first-run setup status
      operationId: getSetup
      tags: [setup]
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/setup/reconcile:
    post:
      summary: Trigger setup reconciler
      operationId: triggerSetupReconcile
      tags: [setup]
      responses:
        '200':
          description: Reconcile started
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: reconciling }
                  already_running: { type: boolean }
        '202':
          description: Reconcile already running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: reconciling }
                  already_running: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/setup/woodpecker:
    put:
      summary: Connect Woodpecker with Forgejo PAT
      description: |
        Validates a Woodpecker personal access token against Forgejo, verifies the user is a Woodpecker administrator,
        persists the encrypted PAT, redeploys Woodpecker with WOODPECKER_ADMIN_USERNAME, and revalidates administration.
        Strict validation, bounded non-empty inputs, never returns or logs the token. Failures leave setup check failed with redacted detail.
      operationId: setupWoodpecker
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, token]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Forgejo login that must match Woodpecker GET /api/user login
                token:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: Woodpecker personal access token
              additionalProperties: false
      responses:
        '200':
          description: Woodpecker PAT accepted and admin verified
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }
        '503':
          description: Woodpecker unavailable or token validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          headers:
            X-Request-ID: { schema: { type: string } }

  /api/v1/users/{id}/enrollment:
    get:
      summary: Get enrollment state per user (proxy from PocketID)
      operationId: getEnrollmentState
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Enrollment, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/{id}/app-access:
    get:
      summary: List per-user application access
      operationId: listApplicationAccess
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Access, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AppAccess' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users/{id}/groups:
    get:
      summary: Get user groups
      operationId: getUserGroups
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Groups, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Group' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Set user groups
      operationId: setUserGroups
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { group_ids: { type: array, items: { type: string } }, groups: { type: array, items: { type: string } } } } } } }
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Bearer token verified via constant-time SHA256 comparison. Required for all /api/v1 routes except /up and /api/v1/email/ingest.
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Device token issued via companion enrollment (oma_dev_...). Required for companion device endpoints; admin bearer is rejected with 403 on these routes.
    hmacAuth:
      type: apiKey
      in: header
      name: X-Omahab-Signature
      description: Worker v1 canonical HMAC-SHA256, optionally prefixed with sha256=. Metadata mirror headers are also required.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Opaque control-plane ID
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0, maximum: 100, default: 50 }
      description: Item limit for pagination (alternative to per_page)
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }

  responses:
    BadRequest:
      description: Bad request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
      headers:
        X-Request-ID: { schema: { type: string } }
    Unauthorized:
      description: Unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
      headers:
        X-Request-ID: { schema: { type: string } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  headers:
    RequestID:
      description: Echoed / generated request identifier
      schema: { type: string }

  schemas:
    BackupRepository:
      type: object
      required: [id, label, location]
      properties:
        id: { type: string }
        label: { type: string }
        location: { type: string }
        secret_ref:
          type: object
          properties:
            id: { type: string }
            version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }

    ID: { type: string, description: Opaque stable identifier }

    Health: { type: string, enum: [unknown, healthy, degraded, unhealthy] }
    Exposure: { type: string, enum: [private, shared, public] }

    Instance:
      type: object
      required: [id, domain, tailnet, tailscale_ip, assistant_name, assistant_slug, created_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        domain: { type: string }
        tailnet: { type: string }
        tailscale_ip: { type: string }
        assistant_name: { type: string }
        assistant_slug: { type: string }
        created_at: { type: string, format: date-time }

    Status:
      type: object
      required: [instance_id, version, health, started_at, now]
      properties:
        instance_id: { type: string }
        version: { type: string }
        health: { $ref: '#/components/schemas/Health' }
        started_at: { type: string, format: date-time }
        now: { type: string, format: date-time }

    Application:
      type: object
      required: [id, name, image, digest, hostname, exposure, health, desired_state, observed_state, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        bundle_id: { type: string }
        image: { type: string }
        digest: { type: string }
        hostname: { type: string }
        exposure: { $ref: '#/components/schemas/Exposure' }
        health: { $ref: '#/components/schemas/Health' }
        desired_state: { type: string }
        observed_state: { type: string }
        installed_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    CatalogBundle:
      type: object
      required: [id, name, image, architectures, default_exposure, max_exposure, installed]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        architectures: { type: array, items: { type: string, enum: [amd64, arm64] } }
        default_exposure: { $ref: '#/components/schemas/Exposure' }
        max_exposure: { $ref: '#/components/schemas/Exposure' }
        memory_mb: { type: integer }
        installed: { type: boolean }

    Project:
      type: object
      required: [id, slug, name, repository_url, exposure, hostname, created_at, updated_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        repository_url: { type: string, format: uri }
        exposure: { $ref: '#/components/schemas/Exposure' }
        hostname: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Release:
      type: object
      required: [id, project_id, commit, digest, status, active, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        commit: { type: string }
        digest: { type: string }
        status: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Secret:
      type: object
      description: Metadata only; value never returned.
      required: [id, scope, name, version, created_at, updated_at]
      properties:
        id: { type: string }
        scope: { type: string }
        name: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Backup:
      type: object
      required: [id, repository, status, started_at]
      properties:
        id: { type: string }
        repository: { type: string }
        snapshot_id: { type: string }
        status: { type: string }
        verified_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        error: { type: string }

    Event:
      type: object
      required: [id, type, severity, message, created_at]
      properties:
        id: { type: string }
        type: { type: string }
        severity: { type: string }
        resource_id: { type: string }
        message: { type: string }
        data: { type: object, additionalProperties: true }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    SyncFolder:
      type: object
      required: [id, name, server_path, share_with_ai, health, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        server_path: { type: string }
        share_with_ai: { type: boolean }
        health: { $ref: '#/components/schemas/Health' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Workspace:
      type: object
      required: [id, project_id, branch, agent, status, last_active_at, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        branch: { type: string }
        agent: { type: string }
        status: { type: string }
        last_active_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    User:
      type: object
      required: [id, email, name, groups, disabled, created_at, updated_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        groups: { type: array, items: { type: string } }
        disabled: { type: boolean }
    ProviderCredential:
      type: object
      description: Metadata only; value and secret_id never returned. managed_by=omahab for API keys via secrets broker, litellm for subscription (chatgpt/xai_oauth) with external_ref.
      required: [id, provider, name, kind, status, configured, managed_by, updated_at]
      properties:
        id: { type: string }
        provider: { type: string, enum: [openai, anthropic, openrouter, chatgpt, xai] }
        name: { type: string }
        kind: { type: string, enum: [api_key, oauth] }
        status: { type: string }
        configured: { type: boolean }
        managed_by: { type: string, enum: [omahab, litellm], description: "omahab=API key via secrets broker (secret_id non-null), litellm=subscription via LiteLLM (external_ref chatgpt|xai_oauth)" }
        external_ref: { type: string, nullable: true, description: "External reference for subscription credentials: chatgpt or xai_oauth; null for API keys" }
        entitlement: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    RecoverySession:
      type: object
      required: [expires_at]
      properties:
        expires_at: { type: string, format: date-time }
        login_url: { type: string, nullable: true }
        code: { type: string, nullable: true }

    EmailMessage:
      type: object
      required: [id, envelope_from, header_from, recipient, subject, authentication, status, received_at]
      properties:
        id: { type: string }
        envelope_from: { type: string }
        header_from: { type: string }
        recipient: { type: string }
        subject: { type: string }
        authentication: { type: string }
        status: { type: string }
        received_at: { type: string, format: date-time }

    ExposureState:
      type: object
      required: [resource_type, resource_id, hostname, exposure, updated_at]
      properties:
        resource_type: { type: string, enum: [application, project] }
        resource_id: { type: string }
        hostname: { type: string }
        exposure: { $ref: '#/components/schemas/Exposure' }
        updated_at: { type: string, format: date-time }

    ReleaseTokenResponse:
      type: object
      required: [token, token_prefix]
      properties:
        token: { type: string }
        token_prefix: { type: string }

    MirrorResponse:
      type: object
      required: [remote_url, lfs]
      properties:
        remote_url: { type: string, format: uri }
        secret_ref: { type: string }
        warnings: { type: array, items: { type: string } }
        lfs: { type: boolean }

    ConfigureMirrorRequest:
      type: object
      required: [remote_url, token]
      properties:
        remote_url: { type: string, format: uri }
        token: { type: string }
        lfs: { type: boolean }
      additionalProperties: false

    WorkspaceCapabilityResponse:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }

    KnowledgeSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        principal: { type: string }
        limit: { type: integer, minimum: 0, maximum: 100 }
      additionalProperties: false

    KnowledgeUploadRequest:
      type: object
      required: [filename, content]
      properties:
        filename: { type: string }
        content: { type: string, format: byte }
        tags: { type: array, items: { type: string } }
        principal: { type: string }
      additionalProperties: false

    Citation:
      type: object
      required: [source_id, deep_link]
      properties:
        source_id: { type: string }
        deep_link: { type: string }
        snippet: { type: string }
        score: { type: number }

    PaperlessMetadata:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        correspondent: { type: string }
        document_type: { type: string }
        tags: { type: array, items: { type: string } }
        deep_link: { type: string }
        text: { type: string }

    KnowledgeSource:
      type: object
      required: [id, kind, name, base_url]
      properties:
        id: { type: string }
        kind: { type: string, enum: [paperless, karakeep, notes] }
        name: { type: string }
        base_url: { type: string }

    IndexSetupOption:
      type: object
      required: [id, label, description]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        model_alias: { type: string, nullable: true }

    ModelInfo:
      type: object
      required: [alias, name, license, size_bytes, expected_memory_mb]
      properties:
        alias: { type: string }
        name: { type: string }
        model_id: { type: string }
        license: { type: string }
        size_bytes: { type: integer }
        expected_memory_mb: { type: integer }
        dimensions: { type: integer }

    EnrollmentState:
      type: object
      required: [user_id, has_passkey, passkey_count]
      properties:
        user_id: { type: string }
        has_passkey: { type: boolean }
        passkey_count: { type: integer }
        enrolled_at: { type: string, format: date-time, nullable: true }

    AppAccess:
      type: object
      required: [client_id, client_name]
      properties:
        client_id: { type: string }
        client_name: { type: string }

    Group:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        friendly_name: { type: string }

    SetupStatus:
      type: object
      required: [state, checks]
      properties:
        state: { type: string, enum: [waiting_for_cloudflare, reconciling, attention, complete] }
        checks: { type: array, items: { $ref: '#/components/schemas/SetupCheck' } }

    SetupCheck:
      type: object
      required: [id, status, label, owner]
      properties:
        id: { type: string }
        label: { type: string }
        owner: { type: string, enum: [operator, system] }
        status: { type: string, enum: [ok, pending, failed, skipped] }
        detail: { type: string }
        action: { type: string }
        apps: { type: array, items: { $ref: '#/components/schemas/SetupAppStatus' } }
        passkey_count: { type: integer }
        target: { type: integer }

    SetupAppStatus:
      type: object
      required: [bundle_id, status]
      properties:
        bundle_id: { type: string }
        status: { type: string, enum: [running, failed, pending] }
        detail: { type: string }

    CreateProjectRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        name: { type: string }
        repository_url: { type: string, format: uri }
        exposure: { $ref: '#/components/schemas/Exposure' }
        hostname: { type: string }
      additionalProperties: false

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        exposure: { $ref: '#/components/schemas/Exposure' }
        hostname: { type: string }
      additionalProperties: false

    CreateReleaseRequest:
      type: object
      required: [commit, digest]
      properties:
        commit: { type: string }
        digest: { type: string }
      additionalProperties: false

    UpdateApplicationRequest:
      type: object
      properties:
        exposure: { $ref: '#/components/schemas/Exposure' }
        desired_state: { type: string }
      additionalProperties: false

    ApplicationActionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [start, stop, restart, update, rollback] }
      additionalProperties: false

    InstallApplicationRequest:
      type: object
      required: [bundle_id]
      properties:
        bundle_id: { type: string }
        name: { type: string }
        hostname: { type: string }
        exposure: { $ref: '#/components/schemas/Exposure' }
      additionalProperties: false

    UpdateExposureRequest:
      type: object
      required: [exposure]
      properties:
        exposure: { $ref: '#/components/schemas/Exposure' }
        confirmation:
          type: string
          description: |
            Required when exposure=public. The caller must repeat the exact
            hostname being made public (case-insensitive). Requests without a
            matching confirmation are rejected with 400 code confirmation_required.
            Optional and ignored for private/shared targets.
      additionalProperties: false

    CreateSecretRequest:
      type: object
      required: [scope, name, value]
      properties:
        scope: { type: string }
        name: { type: string }
        value: { type: string, description: Never returned in reads }
      additionalProperties: false

    UpdateSecretRequest:
      type: object
      required: [value]
      properties:
        value: { type: string }
      additionalProperties: false

    CreateBackupRequest:
      type: object
      properties:
        repository: { type: string }
      additionalProperties: false

    CreateSyncFolderRequest:
      type: object
      required: [name, server_path]
      properties:
        name: { type: string }
        server_path: { type: string }
        share_with_ai: { type: boolean }
      additionalProperties: false

    UpdateSyncFolderRequest:
      type: object
      properties:
        name: { type: string }
        share_with_ai: { type: boolean }
      additionalProperties: false

    CreateWorkspaceRequest:
      type: object
      required: [project_id]
      properties:
        project_id: { type: string }
        branch: { type: string }
        agent: { type: string }
      additionalProperties: false

    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        groups: { type: array, items: { type: string } }
      additionalProperties: false

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string }
        groups: { type: array, items: { type: string } }
        disabled: { type: boolean }
      additionalProperties: false

    CreateProviderCredentialRequest:
      type: object
      required: [provider, kind, value]
      properties:
        provider: { type: string }
        name: { type: string }
        kind: { type: string }
        value: { type: string, description: Secret value, never returned } 
      additionalProperties: false

    EmailIngestRequest:
      type: object
      required: [from, to, timestamp, nonce, raw, rawSize]
      properties:
        from: { type: string, description: SMTP envelope sender }
        to: { type: string, description: SMTP envelope recipient }
        timestamp: { type: string, pattern: '^[0-9]+$' }
        nonce: { type: string }
        raw: { type: string, contentEncoding: base64, description: Base64-encoded raw RFC 5322 message }
        rawSize: { type: integer, minimum: 1, description: Decoded raw byte length }
      additionalProperties: false
    ModelAlias:
      type: object
      description: Stable omahab alias routed via LiteLLM.
      required: [name, credential_id, model, updated_at]
      properties:
        name: { type: string, enum: [omahab/fast, omahab/balanced, omahab/reasoning, omahab/embedding] }
        credential_id: { type: string }
        model: { type: string, description: Upstream model, e.g. gpt-4o, anthropic/claude-3-5-sonnet, xai/grok-4, chatgpt/gpt-4o }
        fallback_order: { type: array, items: { type: string }, nullable: true, description: Ordered fallback credential IDs or model names; empty means no fallback } 
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SetModelAliasRequest:
      type: object
      required: [credential_id, model]
      properties:
        credential_id: { type: string }
        model: { type: string }
        fallback_order: { type: array, items: { type: string } }
      additionalProperties: false
    ModelKey:
      type: object
      description: Metadata for a scoped LiteLLM virtual key; plaintext never returned except once on creation.
      required: [id, name, key_prefix, owner_kind, owner_id, scopes, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        key_prefix: { type: string, description: First 7 chars of key for display, e.g. sk-... }
        owner_kind: { type: string, enum: [hermes, device, harness] }
        owner_id: { type: string }
        scopes: { type: array, items: { type: string } }
        rpm: { type: integer, nullable: true, minimum: 1 }
        tpm: { type: integer, nullable: true, minimum: 1 }
        concurrency: { type: integer, nullable: true, minimum: 1 }
        budget: { type: number, nullable: true, minimum: 0 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
    CreateModelKeyRequest:
      type: object
      required: [name, owner_kind, owner_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        owner_kind: { type: string, enum: [hermes, device, harness] }
        owner_id: { type: string, minLength: 1 }
        scopes: { type: array, items: { type: string, enum: [omahab/fast, omahab/balanced, omahab/reasoning, omahab/embedding] } }
        rpm: { type: integer, minimum: 1 }
        tpm: { type: integer, minimum: 1 }
        concurrency: { type: integer, minimum: 1 }
        budget: { type: number, minimum: 0 }
        expires_at: { type: string, format: date-time }
      additionalProperties: false
    OAuthSession:
      type: object
      description: Safe OAuth session; never includes device codes, access/refresh tokens, auth file contents, or LiteLLM master key.
      required: [provider, flow, verification_url, expires_at, status]
      properties:
        id: { type: string }
        provider: { type: string, enum: [chatgpt, xai] }
        flow: { type: string, enum: [device_code, loopback] }
        verification_url: { type: string, format: uri }
        user_code: { type: string, nullable: true, description: Device-code user code for ChatGPT flow }
        callback_port: { type: integer, nullable: true, description: Loopback callback port for xAI flow (fixed 56121) }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, connected, denied, expired, error] }
    StartProviderOAuthRequest:
      type: object
      required: [flow]
      properties:
        flow: { type: string, enum: [device_code, loopback] }
      additionalProperties: false
    ForwardOAuthCallbackRequest:
      type: object
      required: [callback_path]
      properties:
        callback_path: { type: string, description: "Only the /callback?<query> path; host/scheme/port never accepted; shell metacharacters rejected" }
      additionalProperties: false
    ToolEnvEntry:
      type: object
      description: Metadata for a tool-environment variable (value never returned)
      required: [name, version, created_at, updated_at]
      properties:
        name: { type: string, pattern: '^[A-Z_][A-Z0-9_]{0,127}$', description: Variable name }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PutToolEnvRequest:
      type: object
      required: [value]
      properties:
        value: { type: string, description: Write-only value; must not contain NUL, CR, or LF }
      additionalProperties: false
    CompanionDevice:
      type: object
      description: Companion device record (device token never returned; only prefix)
      required: [id, name, allow_provider_oauth, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        allow_provider_oauth: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanionEnrollment:
      type: object
      description: Enrollment metadata (code returned once, stored only as hash)
      required: [id, expires_at, created_at]
      properties:
        id: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
