        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Set summarization consent (per provider)
      operationId: knowledgeSetConsent
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [principal, provider, granted], properties: { principal: { type: string }, provider: { type: string }, granted: { type: boolean } } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, required: [principal, provider, granted], properties: { principal: { type: string }, provider: { type: string }, granted: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users/{id}/enrollment:
    get:
      summary: Get enrollment state per user (proxy from PocketID)
      operationId: getEnrollmentState
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Enrollment, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
