      responses:
        '200': { description: Tags, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: string } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/knowledge/upload:
    post:
      summary: Upload document to Paperless (assistant tool)
      operationId: knowledgeUpload
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeUploadRequest' } } } }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/knowledge/documents/{id}/tags:
    post:
      summary: Add tag to document (assistant tool)
      operationId: knowledgeAddTag
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tag], properties: { tag: { type: string } } } } } }
      responses:
        '204': { description: Tagged }
