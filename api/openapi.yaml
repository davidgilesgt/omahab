  /api/v1/users/{id}/groups:
    get:
      summary: Get user groups
      operationId: getUserGroups
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Groups, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Group' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Set user groups
      operationId: setUserGroups
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { group_ids: { type: array, items: { type: string } }, groups: { type: array, items: { type: string } } } } } } }
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Bearer token verified via constant-time SHA256 comparison. Required for all /api/v1 routes except /up and /api/v1/email/ingest.
    hmacAuth:
      type: apiKey
      in: header
      name: X-Omahab-Signature
      description: Worker v1 canonical HMAC-SHA256, optionally prefixed with sha256=. Metadata mirror headers are also required.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Opaque control-plane ID
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 0, maximum: 100, default: 50 }
      description: Item limit for pagination (alternative to per_page)
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }

  responses:
    BadRequest:
      description: Bad request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
      headers:
        X-Request-ID: { schema: { type: string } }
    Unauthorized:
      description: Unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
      headers:
        X-Request-ID: { schema: { type: string } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  headers:
    RequestID:
      description: Echoed / generated request identifier
      schema: { type: string }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }

    ID: { type: string, description: Opaque stable identifier }

    Health: { type: string, enum: [unknown, healthy, degraded, unhealthy] }
    Exposure: { type: string, enum: [private, shared, public] }

    Instance:
      type: object
      required: [id, domain, tailnet, tailscale_ip, assistant_name, assistant_slug, created_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        domain: { type: string }
        tailnet: { type: string }
        tailscale_ip: { type: string }
        assistant_name: { type: string }
        assistant_slug: { type: string }
        created_at: { type: string, format: date-time }

    Status:
      type: object
      required: [instance_id, version, health, started_at, now]
      properties:
        instance_id: { type: string }
        version: { type: string }
        health: { $ref: '#/components/schemas/Health' }
        started_at: { type: string, format: date-time }
        now: { type: string, format: date-time }

    Application:
      type: object
      required: [id, name, image, digest, hostname, exposure, health, desired_state, observed_state, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        bundle_id: { type: string }
        image: { type: string }
        digest: { type: string }
        hostname: { type: string }
        exposure: { $ref: '#/components/schemas/Exposure' }
        health: { $ref: '#/components/schemas/Health' }
        desired_state: { type: string }
        observed_state: { type: string }
        installed_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    CatalogBundle:
      type: object
      required: [id, name, image, architectures, default_exposure, max_exposure, installed]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        architectures: { type: array, items: { type: string, enum: [amd64, arm64] } }
        default_exposure: { $ref: '#/components/schemas/Exposure' }
        max_exposure: { $ref: '#/components/schemas/Exposure' }
        memory_mb: { type: integer }
        installed: { type: boolean }

    Project:
      type: object
      required: [id, slug, name, repository_url, bot_profile_id, exposure, hostname, created_at, updated_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        repository_url: { type: string, format: uri }
        bot_profile_id: { type: string }
        exposure: { $ref: '#/components/schemas/Exposure' }
        hostname: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Release:
      type: object
      required: [id, project_id, commit, digest, status, active, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        commit: { type: string }
        digest: { type: string }
        status: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Secret:
      type: object
      description: Metadata only; value never returned.
      required: [id, scope, name, version, created_at, updated_at]
      properties:
        id: { type: string }
        scope: { type: string }
        name: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Backup:
      type: object
      required: [id, repository, status, started_at]
      properties:
        id: { type: string }
        repository: { type: string }
        snapshot_id: { type: string }
        status: { type: string }
        verified_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        error: { type: string }

    Event:
      type: object
      required: [id, type, severity, message, created_at]
      properties:
        id: { type: string }
        type: { type: string }
        severity: { type: string }
        resource_id: { type: string }
        message: { type: string }
        data: { type: object, additionalProperties: true }
