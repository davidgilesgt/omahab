openapi: 3.1.0
info:
  title: Omahab Control API
  description: |
    Authenticated control-plane API for omahabd. All routes are under /api/v1 except
    /up. Bearer authentication is required except for /up and the email webhook which
    uses a separate HMAC authentication path. Mutating requests require Content-Type
    application/json. Unknown JSON fields are rejected. Request bodies are limited
    (1 MiB JSON, 5 MiB email webhook) and per-request timeouts are enforced. SSE
    streaming at /api/v1/events/stream supports Last-Event-ID replay and heartbeat
    comments. Secret and provider-credential reads return metadata only.
  version: 0.1.0
  contact:
    name: Omahab
servers:
  - url: http://localhost:8484
    description: omahabd default listen address
security:
  - bearerAuth: []
tags:
  - name: setup
    description: First-run setup status and Woodpecker PAT handoff
paths:
  /api/bootstrap/claim:
    post:
      summary: Claim the appliance with the one-time bootstrap code
      description: |
        First-boot only (served on the LAN listener, port 8485). Exchanges the
        one-time code shown on the tty1 console for the administrator API
        token. Single-use; 5 attempts/min per host and 20 total, after which
        the code rotates. Inert once bootstrap is complete.
      operationId: claimBootstrap
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: 7gc3x9k2mq }
      responses:
        '200':
          description: Claimed; the token is returned once
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/Error' }

  /api/bootstrap/ssh-keys:
    post:
      summary: Install administrator SSH keys (bootstrap)
      description: First-boot only; requires the bootstrap-claimed bearer token. Imports keys from a GitHub user and/or pasted public keys for the omahab admin account. Empty input skips the step.
      operationId: bootstrapSSHKeys
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                github_user: { type: string }
                keys:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Keys merged additively
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
        '404': { $ref: '#/components/responses/Error' }

  /api/bootstrap/tailscale/up:
    post:
      summary: Start Tailscale enrollment (bootstrap)
      description: First-boot only; runs `tailscale up` and returns the printed auth URL.
      operationId: bootstrapTailscaleUp
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Enrollment started
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth_url: { type: string }
        '502': { $ref: '#/components/responses/Error' }

  /api/bootstrap/tailscale/status:
    get:
      summary: Poll Tailscale enrollment state (bootstrap)
      operationId: bootstrapTailscaleStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  ip: { type: string }
                  state: { type: string }

  /api/bootstrap/complete:
    post:
      summary: Finish first-boot bootstrap
      description: Writes /var/lib/omahab/bootstrap-done and closes the LAN listener. Further enrollment happens on the authenticated dashboard.
      operationId: bootstrapComplete
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Bootstrap complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  complete: { type: boolean }

  /api/v1/setup/verify-cloudflare:
    post:
      summary: Live-verify a Cloudflare API token
      description: Server-side call to Cloudflare's token verify endpoint (the browser cannot call it cross-origin).
      operationId: verifyCloudflareToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
                  detail: { type: string }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/recovery/generate:
    post:
      summary: Generate a recovery key pair (one-time)
      description: Creates an age key pair and an armored recovery kit. The private key is returned exactly once and never persisted; nothing is stored until /api/v1/recovery/confirm.
      operationId: generateRecoveryKey
      responses:
        '200':
          description: Key material (shown once)
          content:
            application/json:
              schema:
                type: object
                required: [public_key, private_key, kit]
                properties:
                  public_key: { type: string }
                  private_key: { type: string }
                  kit: { type: string }

  /api/v1/recovery/confirm:
    post:
      summary: Confirm the saved recovery key
      description: Re-exports the kit to the confirmed public key, persists it at /var/lib/omahab/recovery.age, stores the recovery_age_recipient secret, and marks the recovery_key setup check.
      operationId: confirmRecoveryKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key: { type: string, example: age1... }
      responses:
        '200':
          description: Kit stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmed: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/system/disks:
    get:
      summary: List candidate storage disks
      description: Parses `lsblk -J` and returns non-root/boot filesystems.
      operationId: listDisks
      responses:
        '200':
          description: Candidate disks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    size: { type: string }
                    type: { type: string }
                    fstype: { type: string }
                    uuid: { type: string }
                    mountpoint: { type: string }

  /api/v1/system/storage:
    put:
      summary: Assign a filesystem to a volume role
      description: Appends to /var/lib/omahab/storage.json (consumed by the omahab-storage oneshot unit). volume is media or data; rejected once the target holds data.
      operationId: configureStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volume, fs_uuid]
              properties:
                volume: { type: string, enum: [media, data] }
                fs_uuid: { type: string }
      responses:
        '200':
          description: Placement recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/backup-repositories:
    get:
      summary: List backup repositories
      operationId: listBackupRepositories
      responses:
        '200':
          description: Configured repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupRepository'
    post:
      summary: Configure a backup repository
      description: Stores credentials via the secrets broker and configures the repository by secret reference; enables the daily backup and weekly verify timers.
      operationId: createBackupRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, location, password]
              properties:
                label: { type: string }
                location: { type: string, example: "sftp:user@host:restic-repo" }
                password: { type: string, format: password }
      responses:
        '201':
          description: Repository configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRepository'
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/backup-repositories/{id}:
    delete:
      summary: Delete a backup repository
      description: Repositories with recorded runs are retained for audit.
      operationId: deleteBackupRepository
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }

  /up:
    get:
      summary: Liveness probe
      description: Unauthenticated liveness check.
      operationId: getUp
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: up }
                  version: { type: string }
        '500':
          $ref: '#/components/responses/Error'

  /api/v1/status:
    get:
      summary: Get control-plane status
      operationId: getStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/instance:
    get:
      summary: Get instance identity
      operationId: getInstance
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }
    put:
      summary: Update instance identity
      operationId: updateInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: example.com }
                assistant_name: { type: string, example: My Assistant }
              additionalProperties: false
      responses:
        '200':
          description: Updated instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/catalog:
    get:
      summary: List installable curated bundles
      description: Runtime catalog shipped with signed releases. Empty when no release catalog is present; installs then fail closed.
      operationId: listCatalog
      responses:
        '200':
          description: Catalog bundles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CatalogBundle' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/applications:
    get:
      summary: List applications
      operationId: listApplications
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Application' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      summary: Install a curated bundle
      description: Installs a catalog bundle by id with digest-pinned images. Non-private exposure requires a hostname.
      operationId: installApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallApplicationRequest' }
      responses:
        '201': { description: Installed, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/applications/{id}:
    get:
      summary: Get application
      operationId: getApplication
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Application, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update application
      operationId: updateApplication
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateApplicationRequest' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/applications/{id}/actions:
    post:
      summary: Perform application action
      description: Lifecycle actions (start, stop, restart, update, rollback). Installing a bundle is POST /api/v1/applications.
      operationId: doApplicationAction
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationActionRequest' }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Error' }

  /api/v1/applications/{id}/exposure:
    get:
      summary: Get application exposure
      operationId: getApplicationExposure
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Exposure, content: { application/json: { schema: { $ref: '#/components/schemas/ExposureState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update application exposure
      operationId: updateApplicationExposure
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateExposureRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ExposureState' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/exposure:
    get:
      summary: List all exposure states
      operationId: listExposure
      responses:
        '200':
          description: Exposure list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/ExposureState' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/exposure/{kind}/{id}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [application, project] }
      - $ref: '#/components/parameters/IdPath'
    get:
      summary: Get exposure by kind
      operationId: getExposure
      responses:
        '200': { description: Exposure, content: { application/json: { schema: { $ref: '#/components/schemas/ExposureState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update exposure by kind
      operationId: updateExposure
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateExposureRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ExposureState' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects:
    get:
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Projects
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Project' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create project
      operationId: createProject
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProjectRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/projects/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      summary: Get project
      operationId: getProject
      responses:
        '200': { description: Project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update project
      operationId: updateProject
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProjectRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete project
      operationId: deleteProject
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{id}/exposure:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      summary: Get project exposure
      operationId: getProjectExposure
      responses:
        '200': { description: Exposure, content: { application/json: { schema: { $ref: '#/components/schemas/ExposureState' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update project exposure
      operationId: updateProjectExposure
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateExposureRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ExposureState' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/projects/{id}/releases:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      summary: List releases
      operationId: listReleases
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Releases, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Release' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create release
      operationId: createRelease
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReleaseRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Release' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/projects/{id}/releases/{releaseID}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: releaseID
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get release
      operationId: getRelease
      responses:
        '200': { description: Release, content: { application/json: { schema: { $ref: '#/components/schemas/Release' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{id}/releases/{releaseID}/rollback:
    post:
      summary: Rollback to release
      operationId: rollbackRelease
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: releaseID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rolled back, content: { application/json: { schema: { $ref: '#/components/schemas/Release' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/secrets:
    get:
      summary: List secrets (metadata only)
      description: Secret values are never returned. Each entry is metadata.
      operationId: listSecrets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: scope
          in: query
          schema: { type: string }
          description: Filter by scope
      responses:
        '200': { description: Secrets, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Secret' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create secret
      operationId: createSecret
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSecretRequest' } } } }
      responses:
        '201': { description: Created metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Secret' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/secrets/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      summary: Get secret metadata
      operationId: getSecret
      responses:
        '200': { description: Metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Secret' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Rotate secret value
      operationId: updateSecret
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSecretRequest' } } } }
      responses:
        '200': { description: Updated metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Secret' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete secret
      operationId: deleteSecret
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/backups:
    get:
      summary: List backups
      operationId: listBackups
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Backups, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Backup' } } } } } } }
    post:
      summary: Trigger backup
      operationId: createBackup
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateBackupRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Backup' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/backups/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      summary: Get backup
      operationId: getBackup
      responses:
        '200': { description: Backup, content: { application/json: { schema: { $ref: '#/components/schemas/Backup' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

