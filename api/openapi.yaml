  /api/v1/model-keys:
    get:
      summary: List model keys (metadata)
      description: Returns metadata only; plaintext keys never returned in list.
      operationId: listModelKeys
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ModelKey' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create model key
      description: Creates a scoped virtual key via LiteLLM. Plaintext key returned once in response; stored only as hash/prefix.
      operationId: createModelKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelKeyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ModelKey'
                  - type: object
                    properties:
                      key: { type: string, description: Plaintext key returned once, never persisted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/model-keys/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      summary: Delete model key
      description: Revokes virtual key in LiteLLM and marks metadata revoked.
      operationId: deleteModelKey
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/provider-oauth/{provider}/start:
    post:
      summary: Start provider OAuth flow
      description: Initiates subscription OAuth for chatgpt (device_code) or xai (loopback). Returns verification URL and session metadata; never returns device codes, tokens, or master key.
      operationId: startProviderOAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [chatgpt, xai] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartProviderOAuthRequest' }
      responses:
        '201': { description: OAuth session, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthSession' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/provider-oauth/{provider}/poll/{session_id}:
    get:
      summary: Poll provider OAuth session
      description: Polls OAuth session status; returns safe OAuthSession without device codes, tokens, or master key.
      operationId: pollProviderOAuth
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [chatgpt, xai] }
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OAuth session, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/provider-oauth/{provider}/callback/{session_id}:
    post:
      summary: Forward OAuth callback (device only)
      description: |
        Device-only endpoint. Forwards only the received /callback?<query> path to LiteLLM's fixed loopback at 127.0.0.1:56121.
        Requires device token from an enrolled companion with allow_provider_oauth=true; admin bearer is rejected with 403.
        Rejects foreign host/scheme/port, expired session, wrong device, or shell metacharacters.
      operationId: forwardProviderOAuthCallback
      security: [{ deviceAuth: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [xai] }
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForwardOAuthCallbackRequest' }
      responses:
        '200': { description: OAuth session, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthSession' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tool-environment:
    get:
      summary: List tool-environment variables (metadata only)
      description: |
        Admin only. Returns names, versions, and timestamps only; values never returned.
        Server authoritative singleton `agent-tools`; devices never upload edits.
      operationId: listToolEnvironment
      responses:
        '200':
          description: Tool environment metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ToolEnvEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tool-environment/{NAME}:
    parameters:
      - name: NAME
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Z_][A-Z0-9_]{0,127}$' }
        description: Tool environment variable name (e.g., PARALLEL_API_KEY)
    put:
      summary: Create or rotate tool-environment variable
      description: |
        Admin only. Creates or atomically rotates a write-only value via secrets broker (scope environment).
        Validates name ^[A-Z_][A-Z0-9_]{0,127}$ (max 128), rejects reserved names (OPENAI_BASE_URL, OPENAI_API_KEY, ANTHROPIC_BASE_URL, ANTHROPIC_API_KEY, OMAHAB_MODEL_FAST etc.) with distinct error, and rejects NUL/CR/LF in values so persistent one-line systemd assignments are unambiguous.
        Bumps singleton revision; every mutation, grant change, or generated model-key rotation increments revision.
        Reserved names cannot be overwritten; they are composed per device at fetch time.
      operationId: putToolEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutToolEnvRequest' }
      responses:
        '200':
          description: Created/rotated metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolEnvEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Delete tool-environment variable
      description: Admin only. Removes variable and bumps revision. Returns 404 if not found.
      operationId: deleteToolEnvironment
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/companion/environment:
    get:
      summary: Get companion device tool environment (device only)
      description: |
        Device-only. Returns authoritative bundle of raw values for this device, including per-device reserved vars
        (OPENAI_BASE_URL=https://models.<domain>, ANTHROPIC_BASE_URL, OPENAI_API_KEY=distinct LiteLLM key, ANTHROPIC_API_KEY, OMAHAB_MODEL_*).
        Reserved vars are composed per device at fetch time; admin cannot overwrite them.
        Requires device token (oma_dev_...); admin bearer is rejected with 403.
        Includes ETag W/"rev-<revision>-<deviceIDHash>" derived from revision/device key; honors If-None-Match with 304 so unchanged syncs never resend secrets.
        If device grant removed while still enrolled, returns empty bundle so client clears local values. Fully revoking/losing device cannot erase already downloaded shared keys; dashboard must warn to rotate.
      operationId: getCompanionEnvironment
      security: [{ deviceAuth: [] }]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: ETag from previous fetch; returns 304 if unchanged
      responses:
        '200':
          description: Environment bundle (raw values)
          headers:
            ETag: { schema: { type: string }, description: 'W/"rev-<revision>-<hash>"' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
        '304': { description: Not modified (If-None-Match matches current ETag) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/companion-enrollments:
    post:
      summary: Create companion enrollment code (admin)
      description: |
        Admin only. Generates a single-use enrollment code with at least 192 random bits (24 bytes, base64url),
        10-minute expiry, stored only as SHA-256 hash with constant-time compare.
        Code is returned once and never stored plaintext. Consumed on claim via POST /api/v1/companion/enroll.
      operationId: createCompanionEnrollment
      responses:
        '201':
          description: Enrollment code (once)
          content:
            application/json:
              schema:
                type: object
                required: [id, code, expires_at, created_at]
                properties:
                  id: { type: string }
                  code: { type: string, description: "Single-use code, returned once, at least 192 bits" }
                  expires_at: { type: string, format: date-time }
                  created_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/companion/enroll:
    post:
      summary: Claim enrollment code and create device (public, single-use)
      description: |
        Public (no bearer). Body {code}. Validates SHA-256 hash constant-time, 10-min expiry, single-use consumed_at.
        On success returns oma_dev_... token (stored only as hash, prefix for display) and creates companion_devices row.
        Code never as query/arg; only JSON body. Device token stored only as hash server-side, constant-time compare.
      operationId: enrollCompanion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
              additionalProperties: false
      responses:
        '201':
          description: Device token (once)
          content:
            application/json:
              schema:
                type: object
                required: [token, token_prefix]
                properties:
                  token: { type: string, description: "oma_dev_... token, returned once" }
                  token_prefix: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/companion/status:
    get:
      summary: Get status (device only)
      description: Device-only. Returns control-plane status visible to companion device. Admin bearer rejected with 403.
      operationId: getCompanionStatus
      security: [{ deviceAuth: [] }]
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/companion/events:
    get:
      summary: List events (device only)
      description: Device-only. Returns events visible to companion. Admin bearer rejected.
      operationId: getCompanionEvents
      security: [{ deviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { description: Events, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Event' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/companion/projects:
    get:
      summary: List projects (device only)
      description: Device-only. Returns projects visible to companion. Admin bearer rejected.
      operationId: getCompanionProjects
      security: [{ deviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { description: Projects, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Project' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/companion/devices:
    get:
      summary: List companion devices (admin)
      operationId: listCompanionDevices
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { description: Devices, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CompanionDevice' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/companion/devices/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      summary: Revoke companion device
      description: Admin only. Marks revoked_at, revokes its LiteLLM virtual key (owner_kind=device) and future companion API access. Idempotent.
      operationId: revokeCompanionDevice
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/companion/devices/{id}/allow-oauth:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    put:
      summary: Set device allow_provider_oauth
      description: Admin only. Toggles whether device may relay xAI loopback callback (allow_provider_oauth). Used to gate POST /api/v1/provider-oauth/xai/callback/{session_id}.
      operationId: setDeviceAllowOAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allow: { type: boolean }
                allow_provider_oauth: { type: boolean }
      responses:
        '200': { description: Updated device, content: { application/json: { schema: { $ref: '#/components/schemas/CompanionDevice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/email/ingest:
      summary: Ingest email from Email Worker (HMAC auth)
      description: |
        Separate HMAC auth path for the Cloudflare Email Worker. X-Omahab-Signature
        is HMAC-SHA256 over `v1\n<timestamp>\n<nonce>\n<from>\n<to>\n<raw-size>\n`
        followed by the decoded raw bytes. X-Omahab-Timestamp, X-Omahab-Nonce,
        X-Omahab-From, and X-Omahab-To must exactly match the JSON payload.
        Bearer auth is not accepted here.
      operationId: ingestEmail
      security: [{ hmacAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailIngestRequest' }
      responses:
        '201': { description: Ingested, content: { application/json: { schema: { $ref: '#/components/schemas/EmailMessage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/email/messages:
    get:
      summary: List ingested email messages
      operationId: listEmailMessages
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Messages, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/EmailMessage' } } } } } } }

  /api/v1/email/messages/{id}:
    get:
      summary: Get email message
      operationId: getEmailMessage
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Message, content: { application/json: { schema: { $ref: '#/components/schemas/EmailMessage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/email/routes:
    post:
      summary: Ensure email routing rule (gated on sender verification)
      description: Dashboard-triggered activation of the AI address Cloudflare Email Routing rule. Requires sender verification; routed via scoped Token C.
      operationId: ensureEmailRoute
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient: { type: string, format: email }
      responses:
        '200': { description: Route ensured, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{id}/release-token:
    post:
      summary: Issue per-project release token (admin only, never to Forgejo)
      description: Generates a per-project release token. Returns plaintext once; only hash persisted. Woodpecker holds this token, not an admin bearer.
      operationId: issueReleaseToken
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '201': { description: Issued, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseTokenResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{id}/release-token/rotate:
    post:
      summary: Rotate per-project release token (admin only)
      operationId: rotateReleaseToken
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Rotated, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseTokenResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{id}/releases/with-token:
    post:
      summary: Create release via per-project token (Woodpecker callback, not admin bearer)
      description: |
        Woodpecker release callback. Authorization Bearer is the per-project release token verified via projects.Service.Release (ReleaseTokenVerifier).
        Keeps admin bearer path working but verified via token path. Woodpecker holds no host SSH key or admin credential.
      operationId: releaseWithToken
      security: []
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReleaseRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Release' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/projects/{id}/mirror:
    get:
      summary: Get push-mirror config
      operationId: getPushMirror
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Mirror, content: { application/json: { schema: { $ref: '#/components/schemas/MirrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Configure push-mirror (repo-scoped credential, force-push warning)
      description: |
        Configures a read-only GitHub push mirror via Forgejo. Warnings include force-push overwrite, branch/tag scope, and explicit LFS handling.
        Raw token is stored as repo-scoped secret (scope/name), never in SQLite state or Woodpecker args.
      operationId: configurePushMirror
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigureMirrorRequest' } } } }
      responses:
        '200': { description: Configured, content: { application/json: { schema: { $ref: '#/components/schemas/MirrorResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove push mirror
      operationId: removePushMirror
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/workspaces/{id}/capabilities:
    post:
      summary: Issue workspace capability (one-time, TTL 5m)
      operationId: issueWorkspaceCapability
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '201': { description: Issued, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceCapabilityResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/workspaces/{id}/capabilities/validate:
    post:
      summary: Validate workspace capability (one-time)
      operationId: validateWorkspaceCapability
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        '200': { description: Valid, content: { application/json: { schema: { type: object, required: [valid], properties: { valid: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/knowledge/search:
    post:
      summary: Knowledge search (assistant tool)
      operationId: knowledgeSearch
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeSearchRequest' } } } }
      responses:
        '200': { description: Citations, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Citation' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/knowledge/documents/{id}:
    get:
      summary: Get knowledge document metadata + text (assistant tool)
      operationId: knowledgeGetDocument
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Document, content: { application/json: { schema: { type: object, required: [metadata, text], properties: { metadata: { $ref: '#/components/schemas/PaperlessMetadata' }, text: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/knowledge/documents/{id}/text:
    get:
      summary: Get knowledge document extracted text
      operationId: knowledgeGetText
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { description: Text, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/knowledge/correspondents:
    get:
      summary: List Paperless correspondents (assistant tool)
      operationId: knowledgeListCorrespondents
      responses:
        '200': { description: Correspondents, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: string } } } } } } }
