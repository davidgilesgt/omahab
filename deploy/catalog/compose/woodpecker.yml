# Woodpecker CI — curated Omahab bundle
# Server + agent pair integrated with Forgejo. Forgejo Actions disabled.
name: omahab-woodpecker
networks:
  omahab:
    name: omahab
    external: true
services:
  woodpecker-server:
    image: docker.io/woodpeckerci/woodpecker-server@sha256:${WOODPECKER_SERVER_DIGEST:?pinned digest required}
    restart: unless-stopped
    depends_on:
      woodpecker-postgres:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      WOODPECKER_OPEN: "true"
      WOODPECKER_HOST: "https://ci.${DOMAIN:?domain required}"
      WOODPECKER_FORGEJO: "true"
      WOODPECKER_FORGEJO_URL: "https://git.${DOMAIN:?domain required}/"
      WOODPECKER_FORGEJO_CLIENT_FILE: /run/secrets/woodpecker_forgejo_client_id
      WOODPECKER_FORGEJO_SECRET_FILE: /run/secrets/woodpecker_forgejo_client_secret
      WOODPECKER_AGENT_SECRET_FILE: /run/secrets/woodpecker_agent_secret
      WOODPECKER_GRPC_SECRET_FILE: /run/secrets/woodpecker_grpc_secret
      WOODPECKER_DATABASE_DRIVER: postgres
      WOODPECKER_DATABASE_DATASOURCE_FILE: /run/secrets/woodpecker_db_url
      WOODPECKER_ADMIN_USERNAME: "${WOODPECKER_ADMIN_USERNAME:-}"
      WOODPECKER_GITEA_ORGS: "omahab"
      WOODPECKER_FORGEJO_ORGS: "omahab"
    secrets:
      - woodpecker_forgejo_client_id
      - woodpecker_forgejo_client_secret
      - woodpecker_agent_secret
      - woodpecker_grpc_secret
      - woodpecker_db_url
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    networks:
      - omahab
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/healthz || curl -f http://127.0.0.1:8000/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  woodpecker-agent:
    image: docker.io/woodpeckerci/woodpecker-agent@sha256:${WOODPECKER_AGENT_DIGEST:?pinned digest required}
    restart: unless-stopped
    depends_on:
      woodpecker-server:
        condition: service_healthy
    environment:
      WOODPECKER_SERVER: "woodpecker-server:9000"
      WOODPECKER_AGENT_SECRET_FILE: /run/secrets/woodpecker_agent_secret
      WOODPECKER_GRPC_SECRET_FILE: /run/secrets/woodpecker_grpc_secret
      WOODPECKER_MAX_WORKFLOWS: "2"
      WOODPECKER_FILTER_LABELS: "type=docker"
      WOODPECKER_BACKEND: docker
      DOCKER_HOST: unix:///run/omahab-builder/podman.sock
      WOODPECKER_BACKEND_DOCKER_VOLUMES: "/run/omahab-builder/podman.sock:/run/omahab-builder/podman.sock:rw"
    secrets:
      - woodpecker_agent_secret
      - woodpecker_grpc_secret
    volumes:
      - /run/omahab-builder/podman.sock:/run/omahab-builder/podman.sock
    networks:
      - omahab
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q woodpecker-agent || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  woodpecker-postgres:
    image: docker.io/library/postgres@sha256:${POSTGRES_DIGEST:?pinned digest required}
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: woodpecker
      POSTGRES_USER: woodpecker
      POSTGRES_PASSWORD_FILE: /run/secrets/woodpecker_db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - woodpecker_db_password
    volumes:
      - woodpecker_postgres_data:/var/lib/postgresql/data
    networks:
      - omahab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woodpecker -d woodpecker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

secrets:
  woodpecker_forgejo_client_id:
    file: /var/lib/omahab/secrets/woodpecker_forgejo_client_id
  woodpecker_forgejo_client_secret:
    file: /var/lib/omahab/secrets/woodpecker_forgejo_client_secret
  woodpecker_agent_secret:
    file: /var/lib/omahab/secrets/woodpecker_agent_secret
  woodpecker_grpc_secret:
    file: /var/lib/omahab/secrets/woodpecker_grpc_secret
  woodpecker_db_password:
    file: /var/lib/omahab/secrets/woodpecker_db_password
  woodpecker_db_url:
    file: /var/lib/omahab/secrets/woodpecker_db_url
volumes:
  woodpecker_data:
    name: woodpecker_data
  woodpecker_postgres_data:
    name: woodpecker_postgres_data
