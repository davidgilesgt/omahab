# Hermes — curated Omahab bundle
# Default assistant (profile 'default') + project bots. Separate failure domain from embedding-worker.
name: omahab-hermes
networks:
  omahab:
    name: omahab
    external: true
services:
  hermes:
    image: ghcr.io/omahab/hermes@sha256:${HERMES_DIGEST:?pinned digest required}
    restart: unless-stopped
    depends_on:
      hermes-postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      HERMES_HOST: "0.0.0.0:8080"
      HERMES_PUBLIC_URL: "https://ai.${DOMAIN:?domain required}/"
      HERMES_DATABASE_URL_FILE: /run/secrets/hermes_db_password
      HERMES_JWT_SECRET_FILE: /run/secrets/hermes_jwt_secret
      HERMES_OIDC_ISSUER: "https://id.${DOMAIN}/"
      HERMES_OIDC_CLIENT_ID: "${HERMES_OIDC_CLIENT_ID:?}"
      # Model aliases point to LiteLLM gateway, not raw provider creds.
      HERMES_MODEL_GATEWAY_URL: "http://litellm:4000"
      HERMES_LITELLM_VIRTUAL_KEY_FILE: /run/secrets/hermes_litellm_key
    secrets:
      - hermes_db_password
      - hermes_jwt_secret
      - hermes_litellm_key
    volumes:
      - hermes_data:/data
    networks:
      - omahab
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/api/health || wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hermes-postgres:
    image: docker.io/library/postgres@sha256:${POSTGRES_DIGEST:?pinned digest required}
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD_FILE: /run/secrets/hermes_db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - hermes_db_password
    volumes:
      - hermes_postgres_data:/var/lib/postgresql/data
    networks:
      - omahab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

secrets:
  hermes_db_password:
    file: /var/lib/omahab/secrets/hermes_db_password
  hermes_jwt_secret:
    file: /var/lib/omahab/secrets/hermes_jwt_secret
  hermes_litellm_key:
    file: /var/lib/omahab/secrets/hermes_litellm_key
volumes:
  hermes_data:
    name: hermes_data
  hermes_postgres_data:
    name: hermes_postgres_data
