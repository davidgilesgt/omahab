# Immich — curated Omahab bundle
# Includes server + ML (isolated but co-deployed), postgres (pgvecto.rs), redis.
# Library on host bind /srv/omahab/apps/immich/library for restic backup efficiency.
name: omahab-immich
networks:
  omahab:
    name: omahab
    external: true
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server@sha256:${IMMICH_SERVER_DIGEST:?pinned digest required}
    restart: unless-stopped
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    expose:
      - "2283"
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD_FILE: /run/secrets/immich_db_password
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: "http://immich-machine-learning:3003"
      UPLOAD_LOCATION: /usr/src/app/upload
      IMMICH_PUBLIC_URL: "https://photos.${DOMAIN:?domain required}/"
    secrets:
      - immich_db_password
    volumes:
      - /srv/omahab/apps/immich/library:/usr/src/app/upload
    networks:
      - omahab
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2283/api/server/ping || wget --no-verbose --tries=1 --spider http://127.0.0.1:2283/api/server/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning@sha256:${IMMICH_ML_DIGEST:?pinned digest required}
    restart: unless-stopped
    expose:
      - "3003"
    volumes:
      - immich_model_cache:/cache
    networks:
      - omahab
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3003/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  immich-postgres:
    image: ghcr.io/tensorchord/pgvecto-rs@sha256:${IMMICH_PGVECTO_DIGEST:?pinned digest required}
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - immich_db_password
    volumes:
      - immich_postgres_data:/var/lib/postgresql/data
    networks:
      - omahab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immich || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  immich-redis:
    image: docker.io/library/redis@sha256:${REDIS_DIGEST:?pinned digest required}
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - immich_redis_data:/data
    networks:
      - omahab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

secrets:
  immich_db_password:
    file: /var/lib/omahab/secrets/immich_db_password
volumes:
  immich_postgres_data:
    name: immich_postgres_data
  immich_redis_data:
    name: immich_redis_data
  immich_model_cache:
    name: immich_model_cache
